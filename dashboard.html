<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerWise Egypt - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1F58FF;
            --primary-dark: #1545cc;
            --background: #F3F8FC;
            --surface: #FFFFFF;
            --text-main: #0A1226;
            --text-secondary: #5A6476;
            --border-color: #D1D9EE;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }
        /* القائمة الجانبية Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--surface);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h2 {
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 30px;
            text-align: center;
        }
        .sidebar a {
            display: block;
            padding: 12px 16px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 8px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: var(--background);
            color: var(--primary);
        }
        /* محتوى لوحة التحكم Dashboard */
        .main-content {
            flex: 1;
            padding: 40px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 24px;
            color: var(--text-main);
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--surface);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(31, 88, 255, 0.04);
        }
        .card h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .card .value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <div class="sidebar">
        <h2>PowerWise</h2>
        <a href="#" class="active">🏠 لوحة التحكم</a>
        <a href="#">⚡ استهلاك الطاقة</a>
        <a href="#">📊 التوصيات الذكية</a>
        <a href="#">⚙️ الإعدادات</a>
        <a href="index.html" style="margin-top: auto; color: #dc3545;">🚪 تسجيل الخروج</a>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="main-content">
        <div class="header">
            <h1>مرحباً بك، أحمد 👋</h1>
            <p style="color: var(--text-secondary); font-size: 14px;">نظام إدارة الطاقة الذكي - مصر</p>
        </div>

        <div class="cards-grid">
            <div class="card">
                <h3>إجمالي الاستهلاك اليومي</h3>
                <div class="value">142 كيلوواط</div>
            </div>
            <div class="card">
                <h3>حالة النظام</h3>
                <div class="value" style="color: #28a745;">مستقر ومثالي</div>
            </div>
            <div class="card">
                <h3>نسبة التوفير المتوقعة</h3>
                <div class="value">18.5%</div>
            </div>
        </div>
    </div>

</body>
</html>
