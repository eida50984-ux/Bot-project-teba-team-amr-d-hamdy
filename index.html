<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerWise Egypt - تسجيل الدخول</title>
    <!-- استيراد خط عربي جميل (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1F5BFF;
            --primary-dark: #1545cc;
            --background: #F3F8FC;
            --surface: #FFFFFF;
            --text-main: #0A1226;
            --text-secondary: #5A6478;
            --border-color: #D1D9EE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background-color: var(--surface);
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(31, 91, 255, 0.08);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 24px;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-area p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background-color: var(--border-color);
        }

        .divider::before { right: 0; }
        .divider::after { left: 0; }

        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .btn-google:hover {
            background-color: rgba(31, 91, 255, 0.03);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .footer-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <h1>PowerWise Egypt</h1>
            <p>أهلاً بعودتك، سجل الدخول لمتابعة استهلاك الكهرباء</p>
        </div>

        <form>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox"> تذكرني
                </label>
                <a href="#">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>

        <div class="divider">أو</div>

        <button class="btn-google">
            المتابعة باستخدام Google
        </button>

        <div class="footer-text">
            ليس لديك حساب؟ <a href="#">إنشاء حساب</a>
        </div>
    </div>

</body>
</html>
